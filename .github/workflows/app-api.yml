name: Testes do app (API e telas)

on:
  push:
    paths:
      - "app/**"
      - "db/migrations/**"
      - "db/seeds/**"
      - ".github/workflows/app-api.yml"
  pull_request:
    paths:
      - "app/**"
      - "db/migrations/**"
      - "db/seeds/**"
      - ".github/workflows/app-api.yml"
  workflow_dispatch:

jobs:
  testar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine   # mesma versão do servidor (labflow-postgres)
        env:
          POSTGRES_USER: teste
          POSTGRES_PASSWORD: teste
          POSTGRES_DB: labflow_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teste"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Banco de TESTE, só existe dentro do GitHub Actions; senha fictícia.
      LABFLOW_DB_URL: postgresql://teste:teste@localhost:5432/labflow_teste
      LABFLOW_EXIGIR_BANCO: "1"
    defaults:
      run:
        working-directory: app/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install -r requirements-dev.txt
      - name: Montar o banco de teste (migrations do bot + dados fictícios)
        run: bash scripts/preparar_banco_teste.sh
      - name: Desfazer e reaplicar as migrations do app (prova que cada par funciona)
        run: |
          for desfazer in $(ls -r ../../db/migrations/0[5-9][0-9]_*_desfazer.sql); do
            echo "desfazer: $(basename "$desfazer")"; psql "$LABFLOW_DB_URL" -v ON_ERROR_STOP=1 -q -f "$desfazer"
          done
          for m in $(ls ../../db/migrations/0[5-9][0-9]_*.sql | grep -v _desfazer); do
            echo "aplicar: $(basename "$m")"; psql "$LABFLOW_DB_URL" -v ON_ERROR_STOP=1 -q -f "$m"
          done
      - name: Rodar os testes (pytest)
        run: python -m pytest -q
      - name: Construir a imagem (API + telas) e conferir que ela sobe (APP-011, APP-012)
        working-directory: app
        run: |
          docker build -q -t labflow-api:ci -f api/Dockerfile .
          docker run -d --name labflow-api-ci --network host -e LABFLOW_DB_URL="$LABFLOW_DB_URL" labflow-api:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8000/saude && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/saude || { docker logs labflow-api-ci; exit 1; }
          curl -fsS http://127.0.0.1:8000/app/ | grep -q '<div id="raiz">' || { echo "telas não vieram em /app/"; exit 1; }
          curl -fsS http://127.0.0.1:8000/app/manifest.webmanifest | grep -q '"start_url": "/app/"'

  telas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund
      - name: Testes das telas (Vitest)
        run: npm test
      - name: Montar as telas (TypeScript + Vite)
        run: npm run build
