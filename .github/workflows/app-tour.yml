name: Vídeo do tour (LabFlow)

# Grava o tour guiado do LabFlow com voz de IA e deixa o MP4 em "Artifacts" desta execução.
# Usa só DADOS FICTÍCIOS (o banco de teste com db/seeds). O vídeo nunca vai para o repositório.
on:
  push:
    paths:
      - "app/tour/**"
      - ".github/workflows/app-tour.yml"
  workflow_dispatch:

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: teste
          POSTGRES_PASSWORD: teste
          POSTGRES_DB: labflow_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teste"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LABFLOW_DB_URL: postgresql://teste:teste@localhost:5432/labflow_teste  # banco de TESTE, só existe aqui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Dependências (API, voz de IA, fontes e ffmpeg)
        run: |
          pip install -r app/api/requirements.txt edge-tts==7.3.1
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-noto-color-emoji
      - name: Banco de teste com dados fictícios e a usuária do tour
        working-directory: app/api
        run: |
          bash scripts/preparar_banco_teste.sh
          python ../tour/preparar.py
      - name: Telas
        working-directory: app/web
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Ligar o app
        working-directory: app/api
        run: |
          LABFLOW_WEB_DIR=$PWD/../web/dist LABFLOW_COOKIE_SEGURO=0 LABFLOW_DEMONSTRACAO=0 TZ=America/Sao_Paulo \
            nohup python -m uvicorn labflow_api.main:app --port 8100 > /tmp/api.log 2>&1 &
          for i in $(seq 30); do curl -sf localhost:8100/saude && break; sleep 1; done
      - name: Narração (voz de IA)
        working-directory: app/tour
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
          node -e "import('./roteiro.mjs').then(m => console.log(JSON.stringify(m.roteiro.map(p => p.fala ?? p.legenda))))" > /tmp/falas.json
          python narrar.py /tmp/falas.json /tmp/narracao
      - name: Gravar o tour
        working-directory: app/tour
        run: node gravar.mjs --base http://127.0.0.1:8100 --saida /tmp/tour --duracoes /tmp/narracao/duracoes.json
      - name: Juntar vídeo e narração
        run: python app/tour/montar.py /tmp/tour /tmp/narracao
      - name: Guardar o vídeo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LabFlow-tour
          path: |
            /tmp/tour/tour.mp4
            /tmp/tour/erro-passo-*.png
          retention-days: 30
