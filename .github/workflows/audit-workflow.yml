name: Auditoria do workflow

on:
  push:
    paths:
      - "LabFlow.json"
      - "LabFlow_Alerta_Erro.json"
      - "scripts/audit-workflow.py"
      - ".github/workflows/audit-workflow.yml"
  pull_request:
    paths:
      - "LabFlow.json"
      - "LabFlow_Alerta_Erro.json"
      - "scripts/audit-workflow.py"
      - ".github/workflows/audit-workflow.yml"
  workflow_dispatch:

jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Auditar LabFlow.json (estrutura e dados sensíveis)
        run: python scripts/audit-workflow.py LabFlow.json --public
      - name: Auditar LabFlow_Alerta_Erro.json (estrutura e dados sensíveis)
        run: python scripts/audit-workflow.py LabFlow_Alerta_Erro.json --public
